# Kubernetes Topology: Automated Cold-Chain ASRS Crane Kinematics, Time-Expanded MAPF A
apiVersion: v1
kind: Namespace
metadata:
  name: "automated-ColdChain-asrs-agv-wcs-prod"
  labels:
    standard: "FEM-9851-ASRS-GDP-COLDCHAIN-2026"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "s-curve-stacker-crane-worker"
  namespace: "automated-ColdChain-asrs-agv-wcs-prod"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: "s-curve-stacker-crane-worker"
  template:
    metadata:
      labels:
        app: "s-curve-stacker-crane-worker"
        subsystem: "TwinMastStackerCrane"
    spec:
      containers:
        - name: "s-curve-stacker-crane-worker"
          image: "registry.local/automated_ColdCh/s-curve-stacker-crane-worker:2026.4"
          ports:
            - containerPort: 8101
          env:
            - name: "NOMINAL_SETPOINT"
              value: "28.4"
            - name: "NOMINAL_TOLERANCE"
              value: "0.35"
            - name: "PRIMARY_METRIC_NAME"
              value: "jerk_limited_cycle_sec"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "cbs-mapf-agv-grid-worker"
  namespace: "automated-ColdChain-asrs-agv-wcs-prod"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: "cbs-mapf-agv-grid-worker"
  template:
    metadata:
      labels:
        app: "cbs-mapf-agv-grid-worker"
        subsystem: "TimeExpandedVertexGraph"
    spec:
      containers:
        - name: "cbs-mapf-agv-grid-worker"
          image: "registry.local/automated_ColdCh/cbs-mapf-agv-grid-worker:2026.4"
          ports:
            - containerPort: 8102
          env:
            - name: "NOMINAL_SETPOINT"
              value: "1.04"
            - name: "NOMINAL_TOLERANCE"
              value: "0.01"
            - name: "PRIMARY_METRIC_NAME"
              value: "conflict_tree_expansions"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "arrhenius-fefo-pallet-worker"
  namespace: "automated-ColdChain-asrs-agv-wcs-prod"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: "arrhenius-fefo-pallet-worker"
  template:
    metadata:
      labels:
        app: "arrhenius-fefo-pallet-worker"
        subsystem: "BiologicsColdPallet"
    spec:
      containers:
        - name: "arrhenius-fefo-pallet-worker"
          image: "registry.local/automated_ColdCh/arrhenius-fefo-pallet-worker:2026.4"
          ports:
            - containerPort: 8103
          env:
            - name: "NOMINAL_SETPOINT"
              value: "-21.8"
            - name: "NOMINAL_TOLERANCE"
              value: "0.25"
            - name: "PRIMARY_METRIC_NAME"
              value: "remaining_shelf_life_hrs"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "nh3-co2-cascade-evap-worker"
  namespace: "automated-ColdChain-asrs-agv-wcs-prod"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: "nh3-co2-cascade-evap-worker"
  template:
    metadata:
      labels:
        app: "nh3-co2-cascade-evap-worker"
        subsystem: "AmmoniaCascadeChiller"
    spec:
      containers:
        - name: "nh3-co2-cascade-evap-worker"
          image: "registry.local/automated_ColdCh/nh3-co2-cascade-evap-worker:2026.4"
          ports:
            - containerPort: 8104
          env:
            - name: "NOMINAL_SETPOINT"
              value: "2.85"
            - name: "NOMINAL_TOLERANCE"
              value: "0.04"
            - name: "PRIMARY_METRIC_NAME"
              value: "suction_superheat_k"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "high-speed-airlock-door-worker"
  namespace: "automated-ColdChain-asrs-agv-wcs-prod"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: "high-speed-airlock-door-worker"
  template:
    metadata:
      labels:
        app: "high-speed-airlock-door-worker"
        subsystem: "VestibuleDehumidifier"
    spec:
      containers:
        - name: "high-speed-airlock-door-worker"
          image: "registry.local/automated_ColdCh/high-speed-airlock-door-worker:2026.4"
          ports:
            - containerPort: 8105
          env:
            - name: "NOMINAL_SETPOINT"
