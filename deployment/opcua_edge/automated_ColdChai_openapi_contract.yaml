openapi: "3.1.0"
info:
  title: "Automated Cold-Chain ASRS Crane Kinematics, Time-Expanded MAPF A API"
  version: "2026.4.0"
  description: "Enterprise specification compliant with FEM-9851-ASRS-GDP-COLDCHAIN-2026."
servers:
  - url: "https://telemetry.internal.facility.local/api/v1"
    description: "Primary Closed-Loop Control Cluster"
paths:
  /subsystems/s_curve_stacker_crane/telemetry:
    get:
      operationId: "getTwinMastStackerCraneTelemetrySnapshot"
      summary: "Retrieve real-time Kalman state for TwinMastStackerCrane"
      parameters:
        - name: "facility_node_id"
          in: "query"
          required: true
          schema:
            type: "string"
        - name: "window_size"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 64
      responses:
        "200":
          description: "Deterministic state vector for TwinMastStackerCrane"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwinMastStackerCraneResponse"
    post:
      operationId: "ingestTwinMastStackerCraneFrame"
      summary: "Ingest high-rate sensor frame for TwinMastStackerCrane"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwinMastStackerCraneFrameRequest"
      responses:
        "202":
          description: "Frame accepted into EKF solver pipeline"
