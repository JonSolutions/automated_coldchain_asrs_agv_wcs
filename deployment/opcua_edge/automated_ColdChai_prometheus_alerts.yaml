# Prometheus Alerting Rules: Automated Cold-Chain ASRS Crane Kinematics, Time-Expanded MAPF A
# Standard: FEM-9851-ASRS-GDP-COLDCHAIN-2026
groups:
  - name: "automated_ColdChain_asrs_agv_wcs_s_curve_stacker_crane_rules"
    interval: "5s"
    rules:
      - record: "facility:s_curve_stacker_crane_jerk_limited_cycle_sec:mean5m"
        expr: "avg_over_time(automated_Cold_s_curve_stacker_crane_jerk_limited_cycle_sec[5m])"
        labels:
          subsystem: "TwinMastStackerCrane"
          standard: "FEM-9851-ASRS-GDP-COLDCHAIN-2026"
      - alert: "TwinMastStackerCraneMahalanobisExcursionHigh"
        expr: "automated_Cold_s_curve_stacker_crane_mahalanobis_score > 3.5"
        for: "15s"
        labels:
          severity: "warning"
          subsystem: "TwinMastStackerCrane"
        annotations:
          summary: "TwinMastStackerCrane anomaly score exceeded 3.5 sigma"
          description: "Metric jerk_limited_cycle_sec drifted from baseline 28.4 (tol 0.35)."
      - alert: "TwinMastStackerCraneSafetyInterlockLatched"
        expr: "automated_Cold_s_curve_stacker_crane_interlock_latched == 1"
        for: "1s"
        labels:
          severity: "critical"
          subsystem: "TwinMastStackerCrane"
        annotations:
          summary: "CRITICAL: TwinMastStackerCrane safety interlock tripped"
          description: "Immediate closed-loop damping actuated on s_curve_stacker_crane."
  - name: "automated_ColdChain_asrs_agv_wcs_cbs_mapf_agv_grid_rules"
    interval: "5s"
    rules:
      - record: "facility:cbs_mapf_agv_grid_conflict_tree_expansions:mean5m"
        expr: "avg_over_time(automated_Cold_cbs_mapf_agv_grid_conflict_tree_expansions[5m])"
        labels:
          subsystem: "TimeExpandedVertexGraph"
          standard: "FEM-9851-ASRS-GDP-COLDCHAIN-2026"
      - alert: "TimeExpandedVertexGraphMahalanobisExcursionHigh"
        expr: "automated_Cold_cbs_mapf_agv_grid_mahalanobis_score > 3.5"
        for: "15s"
        labels:
          severity: "warning"
          subsystem: "TimeExpandedVertexGraph"
        annotations:
          summary: "TimeExpandedVertexGraph anomaly score exceeded 3.5 sigma"
          description: "Metric conflict_tree_expansions drifted from baseline 1.04 (tol 0.01)."
      - alert: "TimeExpandedVertexGraphSafetyInterlockLatched"
        expr: "automated_Cold_cbs_mapf_agv_grid_interlock_latched == 1"
        for: "1s"
        labels:
          severity: "critical"
          subsystem: "TimeExpandedVertexGraph"
        annotations:
          summary: "CRITICAL: TimeExpandedVertexGraph safety interlock tripped"
          description: "Immediate closed-loop damping actuated on cbs_mapf_agv_grid."
  - name: "automated_ColdChain_asrs_agv_wcs_arrhenius_fefo_pallet_rules"
    interval: "5s"
    rules:
      - record: "facility:arrhenius_fefo_pallet_remaining_shelf_life_hrs:mean5m"
        expr: "avg_over_time(automated_Cold_arrhenius_fefo_pallet_remaining_shelf_life_hrs[5m])"
        labels:
          subsystem: "BiologicsColdPallet"
          standard: "FEM-9851-ASRS-GDP-COLDCHAIN-2026"
      - alert: "BiologicsColdPalletMahalanobisExcursionHigh"
        expr: "automated_Cold_arrhenius_fefo_pallet_mahalanobis_score > 3.5"
        for: "15s"
        labels:
          severity: "warning"
          subsystem: "BiologicsColdPallet"
        annotations:
          summary: "BiologicsColdPallet anomaly score exceeded 3.5 sigma"
          description: "Metric remaining_shelf_life_hrs drifted from baseline -21.8 (tol 0.25)."
      - alert: "BiologicsColdPalletSafetyInterlockLatched"
        expr: "automated_Cold_arrhenius_fefo_pallet_interlock_latched == 1"
        for: "1s"
        labels:
          severity: "critical"
          subsystem: "BiologicsColdPallet"
        annotations:
          summary: "CRITICAL: BiologicsColdPallet safety interlock tripped"
          description: "Immediate closed-loop damping actuated on arrhenius_fefo_pallet."
  - name: "automated_ColdChain_asrs_agv_wcs_nh3_co2_cascade_evap_rules"
    interval: "5s"
    rules:
      - record: "facility:nh3_co2_cascade_evap_suction_superheat_k:mean5m"
        expr: "avg_over_time(automated_Cold_nh3_co2_cascade_evap_suction_superheat_k[5m])"
        labels:
          subsystem: "AmmoniaCascadeChiller"
          standard: "FEM-9851-ASRS-GDP-COLDCHAIN-2026"
      - alert: "AmmoniaCascadeChillerMahalanobisExcursionHigh"
